.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >Downloads a whole episode in</text><text x="656.0" y="280.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >one request per file. Keeps</text><text x="656.0" y="300.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >32 episodes in RAM.</text><line x1="656" y1="312" x2="912" y2="312" stroke="#2c2c2a"/><text x="656.0" y="336.0" font-size="14" font-weight="650" text-anchor="start" fill="#ffffff" >Stacked: 1.4x to 1.5x faster</text></svg>
