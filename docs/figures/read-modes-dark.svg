e" stroke-width="1" /><rect x="585.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="601.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><path d="M339.5,176 Q361.8,150 384.0,176" fill="none" stroke="#9085e9" stroke-width="2" stroke-linecap="round"/><path d="M384.0,176 Q440.0,150 496.0,176" fill="none" stroke="#9085e9" stroke-width="2" stroke-linecap="round"/><path d="M496.0,176 Q536.0,150 576.0,176" fill="none" stroke="#9085e9" stroke-width="2" stroke-linecap="round"/><text x="352.0" y="260.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >Jumps to any frame.</text><text x="352.0" y="280.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >Each jump can need a new</text><text x="352.0" y="300.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >network request.</text><line x1="352" y1="312" x2="608" y2="312" stroke="#2c2c2a"/><text x="352.0" y="336.0" font-size="14" font-weight="650" text-anchor="start" fill="#ffffff" >1 reader: the same. 8 readers: 1.5x</text><rect x="640.0" y="96.0" width="288.0" height="256.0" rx="10" fill="#242423" stroke="none" stroke-width="1" /><text x="656.0" y="124.0" font-size="16" font-weight="650" text-anchor="start" fill="#ffffff" >Whole episodes</text><text x="656.0" y="144.0" font-size="13" font-weight="400" text-anchor="start" fill="#898781" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PR #3917</text><rect x="649.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="665.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="681.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="697.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="713.5" y="180.0" width="13.