<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The 3 read patterns we tested</title><desc id="d">Streaming reads each file forward. Random access jumps to any frame. PR #3917 downloads whole episodes into a RAM pool.</desc><style></style><rect x="0.5" y="0.5" width="959.0" height="371.0" rx="12" fill="#1a1a19" stroke="#383835" stroke-width="1" /><text x="32.0" y="40.0" font-size="20" font-weight="650" text-anchor="start" fill="#ffffff" >What we tested: 3 ways training reads the videos</text><text x="32.0" y="64.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >Each strip is one video file. Each square is one frame.</text><rect x="32.0" y="96.0" width="288.0" height="256.0" rx="10" fill="#242423" stroke="none" stroke-width="1" /><text x="48.0" y="124.0" font-size="16" font-weight="650" text-anchor="start" fill="#ffffff" >Streaming</text><text x="48.0" y="144.0" font-size="13" font-weight="400" text-anchor="start" fill="#898781" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">StreamingLeRobotDataset</text><rect x="41.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="57.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="73.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="89.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="105.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="121.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="137.5" y="180.0" width="13.0" height="13.0" rx="2" fill="#383835" stroke="none" stroke-width="1" /><rect x="153.5" y