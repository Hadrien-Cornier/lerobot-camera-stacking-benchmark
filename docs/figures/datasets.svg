<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 518" width="960" height="518" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Stacked vs separate files, 5 datasets</title><desc id="d">libero: streaming 1.33x, map-style 1.18x; ABC: streaming 1.89x; droid_1.0.1: streaming 1.48x, map-style 1.13x; MolmoAct2: streaming 1.24x, map-style 0.75x; high_quality_folding: streaming 1.00x, map-style 0.68x</desc><style></style><rect x="0.5" y="0.5" width="959.0" height="517.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1" /><text x="32.0" y="40.0" font-size="20" font-weight="650" text-anchor="start" fill="#0b0b0b" >Stacked vs separate files, 5 datasets</text><text x="32.0" y="64.0" font-size="14" font-weight="400" text-anchor="start" fill="#52514e" >How much faster stacked is. Right of 1x: stacked wins. Sorted by pixels per sample.</text><rect x="600.0" y="30.0" width="12.0" height="12.0" rx="3" fill="#4a3aa7" stroke="none" stroke-width="1" /><text x="618.0" y="40.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e" >Streaming, 1 process</text><rect x="770.0" y="30.0" width="12.0" height="12.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1" /><text x="788.0" y="40.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e" >Map-style, 4 workers</text><line x1="450.0" y1="124" x2="450.0" y2="448" stroke="#e1e0d9" stroke-width="1"/><text x="450.0" y="116.0" font-size="12" font-weight="400" text-anchor="middle" fill="#898781" >0.5x</text><line x1="561.1" y1="124" x2="561.1" y2="448" stroke="#e1e0d9" stroke-width="1"/><text x="561.1" y="116.0" font-size="12" font-weight="400" text-anchor="middle" fill="#898781" >0.75x</text><line x1="640.0" y1="124" x2="640.0" y2="448" stroke="#c3c2b7" stroke-width="1.5"/><text x="640.0" y="116.0" font-size="12" font-weight="400" text-anchor="middle" fill="#898781" >1x</text><line x1="751.1" y1="124" x2="751.1" y2="448" stroke="#e1e0d9" stroke-width="1"/><text x="751.1" y="116.0" font-size="12" font-weight="400" text-anchor="middle" fill="#898781" >1.5x</text><line x1="830.0" y1="124" x2="830.0" y2="448" stroke="#e1e0d9" stroke-width="1"/><text x="830.0" y="116.0" font-size="12" font-weight="400" text-anchor="middle" fill="#898781" >2x</text><text x="32.0" y="154.0" font-size="14" font-weight="600" text-anchor="start" fill="#0b0b0b" >libero</text><text x="32.0" y="174.0" font-size="13" font-weight="400" text-anchor="start" fill="#898781" >2 × 256×256, 0.13 MP</text><path d="M640.0,140.0 H713.7 Q717.7,140.0 717.7,144.0 V154.0 Q717.7,158.0 713.7,158.0 H640.0 Z" fill="#4a3aa7"/><text x="725.7" y="154.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" >1.33x</text><path d="M640.0,162.0 H681.3 Q685.3,162.0 685.3,166.0 V176.0 Q685.3,180.0 681.3,180.0 H640.0 Z" fill="#eb6834"/><text x="693.3" y="176.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" >1.18x</text><text x="32.0" y="218.0" font-size="14" font-weight="600" text-anchor="start" fill="#0b0b0b" >ABC</text><text x="32.0" y="238.0" font-size="13" font-weight="400" text-anchor="start" fill="#898781" >3 × 224×224, 0.15 MP</text><path d="M640.0,204.0 H809.8 Q813.8,204.0 813.8,208.0 V218.0 Q813.8,222.0 809.8,222.0 H640.0 Z" fill="#4a3aa7"/><text x="821.8" y="218.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" >1.89x</text><text x="648.0" y="240.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#898781" >not run</text><text x="32.0" y="282.0" font-size="14" font-weight="600" text-anchor="start" fill="#0b0b0b" >droid_1.0.1</text><text x="32.0" y="302.0" font-size="13" font-weight="400" text-anchor="start" fill="#898781" >3 × 180×320, 0.17 MP</text><path d="M640.0,268.0 H743.9 Q747.9,268.0 747.9,272.0 V282.0 Q747.9,286.0 743.9,286.0 H640.0 Z" fill="#4a3aa7"/><text x="755.9" y="282.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" >1.48x</text><path d="M640.0,290.0 H668.4 Q672.4,290.0 672.4,294.0 V304.0 Q672.4,308.0 668.4,308.0 H640.0 Z" fill="#eb6834"/><text x="680.4" y="304.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" >1.13x</text><text x="32.0" y="346.0" font-size="14" font-weight="600" text-anchor="start" fill="#0b0b0b" >MolmoAct2</text><text x="32.0" y="366.0" font-size="13" font-weight="400" text-anchor="start" fill="#898781" >3 × 360×640, 0.69 MP</text><path d="M640.0,332.0 H695.1 Q699.1,332.0 699.1,336.0 V346.0 Q699.1,350.0 695.1,350.0 H640.0 Z" fill="#4a3aa7"/><text x="707.1" y="346.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" >1.24x</text><g transform="translate(1280.0,0) scale(-1,1)"><path d="M640.0,354.0 H715.7 Q719.7,354.0 719.7,358.0 V368.0 Q719.7,372.0 715.7,372.0 H640.0 Z" fill="#eb6834"/></g><text x="552.3" y="368.0" font-size="12.5" font-weight="400" text-anchor="end" fill="#52514e" >0.75x</text><text x="32.0" y="410.0" font-size="14" font-weight="600" text-anchor="start" fill="#0b0b0b" >high_quality_folding</text><text x="32.0" y="430.0" font-size="13" font-weight="400" text-anchor="start" fill="#898781" >2 × 720p + 480×640, 2.15 MP</text><path d="M640.0,396.0 H641.0 Q645.0,396.0 645.0,400.0 V410.0 Q645.0,414.0 641.0,414.0 H640.0 Z" fill="#4a3aa7"/><text x="650.0" y="410.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" >1.00x</text><g transform="translate(1280.0,0) scale(-1,1)"><path d="M640.0,418.0 H741.0 Q745.0,418.0 745.0,422.0 V432.0 Q745.0,436.0 741.0,436.0 H640.0 Z" fill="#eb6834"/></g><text x="527.0" y="432.0" font-size="12.5" font-weight="400" text-anchor="end" fill="#52514e" >0.68x</text><text x="32.0" y="478.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#898781" >Streaming reads cameras one after another, so stacking saves a fixed cost per camera. It matters less as frames grow.</text><text x="32.0" y="498.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#898781" >Map-style already decodes each camera in its own thread, so separate files use more cores. Hugging Face Jobs, 8 CPUs.</text></svg>
