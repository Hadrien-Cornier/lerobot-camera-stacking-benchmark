<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Decoder cache overflow</title><desc id="d">With 24 files in use and a cache of 12, separate files hit the cache half the time and make 4.6 frames/s. Stacked uses 8 files, all fit, 308 frames/s.</desc><style></style><rect x="0.5" y="0.5" width="959.0" height="419.0" rx="12" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1" /><text x="32.0" y="40.0" font-size="20" font-weight="650" text-anchor="start" fill="#0b0b0b" >Why separate files collapse when the decoder cache is too small</text><text x="32.0" y="64.0" font-size="14" font-weight="400" text-anchor="start" fill="#52514e" >Each worker keeps a cache of open video decoders. A file not in the cache must be opened again over the network.</text><text x="32.0" y="118.0" font-size="15" font-weight="650" text-anchor="start" fill="#0b0b0b" >Separate files: 8 shards x 3 cameras = 24 files in use</text><rect x="26.0" y="128.0" width="486.0" height="46.0" rx="8" fill="none" stroke="#52514e" stroke-width="1.5" /><text x="32.0" y="194.0" font-size="12" font-weight="400" text-anchor="start" fill="#898781" >cache: 12 open decoders</text><rect x="35.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="75.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="115.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="155.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="195.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="235.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="275.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="315.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="355.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="395.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="435.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="475.0" y="137.0" width="28.0" height="28.0" rx="4" fill="#1baf7a" stroke="none" stroke-width="1" /><g stroke="#52514e" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" ><line x1="686.0" y1="176.0" x2="518.0" y2="176.0"/><polyline points="524.3,173.0 518.0,176.0 524.3,179.0"/></g><rect x="536.0" y="130.0" width="20.0" height="18.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="562.0" y="130.0" width="20.0" height="18.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="588.0" y="130.0" width="20.0" height="18.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="614.0" y="130.0" width="20.0" height="18.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="640.0" y="130.0" width="20.0" height="18.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="666.0" y="130.0" width="20.0" height="18.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="536.0" y="152.0" width="20.0" height="18.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="562.0" y="152.0" width="20.0" height="18.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="588.0" y="152.0" width="20.0" height="18.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="614.0" y="152.0" width="20.0" height="18.0" rx="3" fill="#2a78d6" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="640.0" y="152.0" width="20.0" height="18.0" rx="3" fill="#eb6834" stroke="none" stroke-width="1" fill-opacity="0.4"/><rect x="666.0" y="152.0" width="20.0" height="18.0" rx="3" fill="#1baf7a" stroke="none" stroke-width="1" fill-opacity="0.4"/><text x="536.0" y="198.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e" >12 more: evicted and reopened,</text><text x="536.0" y="214.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e" >about 143 ms each</text><text x="928.0" y="144.0" font-size="22" font-weight="650" text-anchor="end" fill="#0b0b0b" >4.6 frames/s</text><text x="928.0" y="166.0" font-size="13" font-weight="400" text-anchor="end" fill="#52514e" >hit rate 0.5</text><text x="32.0" y="242.0" font-size="15" font-weight="650" text-anchor="start" fill="#0b0b0b" >Stacked: 8 shards x 1 file = 8 files in use</text><rect x="26.0" y="252.0" width="486.0" height="46.0" rx="8" fill="none" stroke="#52514e" stroke-width="1.5" /><text x="32.0" y="318.0" font-size="12" font-weight="400" text-anchor="start" fill="#898781" >cache: 12 open decoders</text><rect x="34.0" y="260.0" width="30.0" height="9.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="34.0" y="270.0" width="30.0" height="9.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="34.0" y="280.0" width="30.0" height="9.0" rx="1" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="74.0" y="260.0" width="30.0" height="9.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="74.0" y="270.0" width="30.0" height="9.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="74.0" y="280.0" width="30.0" height="9.0" rx="1" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="114.0" y="260.0" width="30.0" height="9.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="114.0" y="270.0" width="30.0" height="9.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="114.0" y="280.0" width="30.0" height="9.0" rx="1" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="154.0" y="260.0" width="30.0" height="9.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="154.0" y="270.0" width="30.0" height="9.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="154.0" y="280.0" width="30.0" height="9.0" rx="1" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="194.0" y="260.0" width="30.0" height="9.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="194.0" y="270.0" width="30.0" height="9.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="194.0" y="280.0" width="30.0" height="9.0" rx="1" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="234.0" y="260.0" width="30.0" height="9.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="234.0" y="270.0" width="30.0" height="9.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="234.0" y="280.0" width="30.0" height="9.0" rx="1" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="274.0" y="260.0" width="30.0" height="9.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="274.0" y="270.0" width="30.0" height="9.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="274.0" y="280.0" width="30.0" height="9.0" rx="1" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="314.0" y="260.0" width="30.0" height="9.0" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" /><rect x="314.0" y="270.0" width="30.0" height="9.0" rx="1" fill="#eb6834" stroke="none" stroke-width="1" /><rect x="314.0" y="280.0" width="30.0" height="9.0" rx="1" fill="#1baf7a" stroke="none" stroke-width="1" /><rect x="355.0" y="261.0" width="28.0" height="28.0" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 3"/><rect x="395.0" y="261.0" width="28.0" height="28.0" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 3"/><rect x="435.0" y="261.0" width="28.0" height="28.0" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 3"/><rect x="475.0" y="261.0" width="28.0" height="28.0" rx="4" fill="none" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="3 3"/><text x="536.0" y="280.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e" >All files fit.</text><text x="928.0" y="268.0" font-size="22" font-weight="650" text-anchor="end" fill="#0b0b0b" >308 frames/s</text><text x="928.0" y="290.0" font-size="13" font-weight="400" text-anchor="end" fill="#52514e" >hit rate 1.0</text><line x1="32" y1="358" x2="928" y2="358" stroke="#e1e0d9"/><text x="32.0" y="380.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e" >Real training: lerobot-train uses shards = num_workers, and the default cache holds 100 decoders.</text><text x="32.0" y="400.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e" >So separate files overflow at about 34 workers. Stacked overflows at about 100. The test above (cache 12) has the same hit rate as 64 workers.</text></svg>
